name: build

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vaultwarden aus dem offiziellen Quelltext bauen, Patches anwenden
        run: sh test/build.sh 1.37.3 "${GITHUB_REF_NAME#v}"
      - name: Abbild prüfen
        run: sh test/test.sh "dtadmin-vaultwarden:${GITHUB_REF_NAME#v}"
      - name: Bei ghcr.io anmelden
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Abbild hochladen (nur bei Versions-Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/dtadmin-vaultwarden
          VERSION="${GITHUB_REF_NAME#v}"
          docker tag "dtadmin-vaultwarden:$VERSION" "$IMG:$VERSION"
          docker push "$IMG:$VERSION"
